[project]
name = "ops-pilot"
version = "0.1.0"
description = "Approval-gated incident commander built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "streamlit>=1.50.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ops-pilot = "ops_pilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
